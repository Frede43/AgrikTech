services:
  - type: web
    name: agriconnect-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: alembic -c backend/alembic.ini upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Secret pour POST /bootstrap/admin — crée le premier admin sans accès
      # shell (utile sur le plan gratuit). Se désactive dès qu'un admin existe.
      - key: ADMIN_BOOTSTRAP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agriconnect-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: SMS_PROVIDER
        value: console
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_SENDER_ID
        sync: false
      - key: MOBILE_MONEY_PROVIDER
        value: mock
      - key: MOBILE_MONEY_API_URL
        sync: false
      - key: MOBILE_MONEY_API_KEY
        sync: false
      - key: MOBILE_MONEY_WEBHOOK_SECRET
        sync: false
      - key: ORS_API_KEY
        sync: false

databases:
  - name: agriconnect-db
    plan: free
