services:
  - type: web
    name: agriconnect-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: alembic -c backend/alembic.ini upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Secret pour POST /bootstrap/admin — crée le premier admin sans accès
      # shell (utile sur le plan gratuit). Se désactive dès qu'un admin existe.
      - key: ADMIN_BOOTSTRAP_SECRET
        generateValue: true
      # Base PostgreSQL migrée vers Neon (2026-09) : la base Render gratuite
      # arrivait en fin de rétention et allait être suspendue. `sync: false`
      # (au lieu de `fromDatabase`) pour que Render ne réécrase jamais cette
      # valeur avec la connexion vers l'ancienne base agriconnect-db — elle
      # se règle uniquement à la main dans le dashboard Render.
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_HTTPS_ONLY
        value: "true"
      # Front (Vercel) et back (Render) sont deux domaines distincts : le
      # cookie de session doit être cross-site (SameSite=None + Secure).
      - key: SESSION_SAMESITE
        value: "none"
      - key: SMS_PROVIDER
        value: console
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_SENDER_ID
        sync: false
      - key: MOBILE_MONEY_PROVIDER
        value: mock
      - key: MOBILE_MONEY_API_URL
        sync: false
      - key: MOBILE_MONEY_API_KEY
        sync: false
      - key: MOBILE_MONEY_WEBHOOK_SECRET
        sync: false
      - key: ORS_API_KEY
        sync: false

databases:
  - name: agriconnect-db
    plan: free
